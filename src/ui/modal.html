{{! defaults: {"title": "Janela", "size": "md", "closeLabel": "Fechar", "class": ""} }}
<div class="modal" id="{{ id }}" data-flash-modal hidden aria-hidden="true">
  <div class="modal__backdrop" data-flash-backdrop></div>
  <div class="modal__dialog modal__dialog--{{ size }}{{ class ? ' ' + class : '' }}" role="dialog" aria-modal="true" aria-labelledby="{{ id }}-title" tabindex="-1" {{ attrs }}>
    <header class="modal__header">
      <h2 class="modal__title" id="{{ id }}-title">{{ title }}</h2>
      <button type="button" class="modal__close" data-flash-close aria-label="{{ closeLabel }}">&times;</button>
    </header>
    <div class="modal__body">{{ slot }}</div>
  </div>
</div>
